apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s-manifests/
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: java-microservice
  name: java-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: java-microservice
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s-manifests/
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: java-microservice
    spec:
      containers:
        - env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: java-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: jdbc:postgresql://java-db:5440/microservice
            - name: POSTGRES_USER
              value: user
          image: dmytrolazarenko/microservice:1.0.0
          name: java-microservice
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
